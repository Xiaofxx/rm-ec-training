<svg xmlns="http://www.w3.org/2000/svg" width="560" height="730" viewBox="0 0 560 730" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">小车分路供电拓扑</title><desc id="desc">电池经保护与总开关分三路：逻辑五伏、舵机电源、电机电源。不同电压正极不相连，所有非隔离模块共地。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="560" height="730" rx="12" fill="#f8fafc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172554" text-anchor="middle">
<text x="280" y="36" font-size="23" font-weight="700">电池分路供电</text>
<rect x="145" y="58" width="270" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="280" y="94" font-size="20">电池组</text>
<path d="M280 116V140" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="115" y="142" width="330" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="280" y="178" font-size="19">保险 / 保护 → 总开关</text>
<path d="M280 200V218H38V560M38 282H68M38 414H68M38 546H68" fill="none" stroke="#475569" stroke-width="2"/>
<g fill="#eef2ff" stroke="#6366f1"><rect x="70" y="246" width="180" height="74" rx="9"/><rect x="70" y="378" width="180" height="74" rx="9"/><rect x="70" y="510" width="180" height="74" rx="9"/></g>
<g font-size="18"><text x="160" y="275">逻辑 DC-DC</text><text x="160" y="302">稳定 5V</text><text x="160" y="407">舵机 DC-DC</text><text x="160" y="434">按舵机电压设置</text><text x="160" y="539">电机电源支路</text><text x="160" y="566">按电机电压设置</text></g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)"><path d="M250 282H295"/><path d="M250 414H295"/><path d="M250 546H295"/></g>
<g fill="#ecfdf5" stroke="#059669"><rect x="300" y="246" width="230" height="74" rx="9"/><rect x="300" y="378" width="230" height="74" rx="9"/><rect x="300" y="510" width="230" height="74" rx="9"/></g>
<g font-size="18"><text x="415" y="275">核心板 5V 输入</text><text x="415" y="302">无线模块另核对电压</text><text x="415" y="407">舵机电源正极</text><text x="415" y="434">大电流不经过核心板</text><text x="415" y="539">H桥 VM → 电机</text><text x="415" y="566">驱动、负载都要匹配</text></g>
<g font-size="16" fill="#475569"><text x="280" y="350">分路电源的电流能力分别核算</text><text x="280" y="481">电池直供电机时，满电电压也必须兼容</text></g>
<rect x="30" y="616" width="500" height="82" rx="9" fill="#fff7ed" stroke="#ea580c"/>
<text x="280" y="647" font-size="19" font-weight="700">所有非隔离模块 GND 共地</text><text x="280" y="677" font-size="18">不同电压的正极不能并接</text>
</g></svg>
