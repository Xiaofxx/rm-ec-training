<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><text x="30" y="43" font-size="23" font-weight="bold" fill="#0f172a" font-family="Microsoft YaHei, sans-serif">0x1234：数值不变，地址中的排列不同</text><path d="M360 132.5 L430 132.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M690 132.5 L760 132.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="90" width="320" height="85" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="200.0" y="117" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">16位整数：0x1234</text><text x="200.0" y="141" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">高8位 = 0x12；低8位 = 0x34</text><rect x="430" y="90" width="260" height="85" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="560.0" y="117" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">提取低字节</text><text x="560.0" y="141" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">bits &amp; 0xFF → 0x34</text><rect x="760" y="90" width="290" height="85" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="905.0" y="117" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">提取高字节</text><text x="905.0" y="141" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">(bits &gt;&gt; 8) &amp; 0xFF → 0x12</text><rect x="100" y="290" width="400" height="115" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="300.0" y="317" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">小端：低地址 → 高地址</text><text x="300.0" y="341" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">地址0：0x34</text><text x="300.0" y="365" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">地址1：0x12</text><rect x="610" y="290" width="400" height="115" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="810.0" y="317" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">大端：低地址 → 高地址</text><text x="810.0" y="341" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">地址0：0x12</text><text x="810.0" y="365" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">地址1：0x34</text></svg>