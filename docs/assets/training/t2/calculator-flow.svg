<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><text x="30" y="43" font-size="23" font-weight="bold" fill="#0f172a" font-family="Microsoft YaHei, sans-serif">先选择，再输入；计算完返回菜单</text><path d="M210 137.5 L270 137.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M475 137.5 L535 137.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="505.0" y="129.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei,sans-serif" fill="#475569">否</text><path d="M770 137.5 L835 137.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="802.5" y="129.5" text-anchor="middle" font-size="14" font-family="Microsoft YaHei,sans-serif" fill="#475569">否</text><path d="M947.5 175 L947.5 310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M835 352.5 L670 352.5" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="100" width="185" height="75" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="117.5" y="127" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">显示菜单</text><text x="117.5" y="151" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">读choice</text><rect x="270" y="100" width="205" height="75" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="372.5" y="127" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">choice == 5？</text><text x="372.5" y="151" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">成立：退出循环</text><rect x="535" y="100" width="235" height="75" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="652.5" y="127" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">不在1到4之间？</text><text x="652.5" y="151" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">成立：提示并continue</text><rect x="835" y="100" width="225" height="75" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="947.5" y="127" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">有效运算编号</text><text x="947.5" y="151" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">读取a、b</text><rect x="835" y="310" width="225" height="85" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="947.5" y="337" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">switch执行运算</text><text x="947.5" y="361" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">除法先判断b是否为0</text><rect x="310" y="310" width="360" height="85" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="490.0" y="337" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">本轮结束，重新显示菜单</text><text x="490.0" y="361" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">switch中的break只退出switch</text></svg>