amily="Microsoft YaHei, sans-serif" font-size="20" fill="#182638" font-weight="bold">位模式沿箭头递增</text><text x="550" y="439" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#182638" font-weight="normal">模16运算：只保留低4位</text><text x="550" y="474" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#182638" font-weight="normal">1111 → 0000</text><rect x="55" y="790" width="990" height="112" rx="12" fill="#e0f2fe"/><text x="550" y="820" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#182638" font-weight="normal">−2对应1110：无符号值14 = 16 − 2；1110 + 0010 = 1 0000</text><text x="550" y="850" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#182638" font-weight="normal">只保留低4位，结果为0000；这说明−2与2互为加法逆元</text><text x="550" y="881" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#9a3412" font-weight="normal">0111 → 1000表示7 → −8：仅展示位模式变化，C有符号溢出不能用来验证回绕</text></svg>