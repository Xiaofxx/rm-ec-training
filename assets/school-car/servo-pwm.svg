<svg xmlns="http://www.w3.org/2000/svg" width="560" height="740" viewBox="0 0 560 740" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">舵机常用50Hz PWM：周期、脉宽与占空比</title><desc id="desc">三行波形的频率均为50赫兹，周期20毫秒。高电平宽度为1、1.5、2毫秒，对应占空比5%、7.5%、10%。同一占空比只有在周期相同时才对应相同脉宽。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#64748b"/></marker></defs>
<rect width="560" height="740" rx="12" fill="#f8fafc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#172554">
<g text-anchor="middle"><text x="280" y="34" font-size="23" font-weight="700">舵机常用PWM：50Hz</text><text x="280" y="65" font-size="18">周期20ms不变，改变占空比</text></g>
<g stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"><path d="M60 105V225M500 105V225M60 290V410M500 290V410M60 475V595M500 475V595"/></g>
<g stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M64 108H496"/><path d="M64 293H496"/><path d="M64 478H496"/></g>
<g font-size="17" text-anchor="middle"><text x="280" y="99">一个周期 T = 20ms</text><text x="280" y="284">一个周期 T = 20ms</text><text x="280" y="469">一个周期 T = 20ms</text></g>
<g fill="#dbeafe"><rect x="60" y="156" width="22" height="54"/><rect x="60" y="341" width="33" height="54"/><rect x="60" y="526" width="44" height="54"/></g>
<g fill="none" stroke="#2563eb" stroke-width="3"><path d="M38 210H60V156H82V210H500V156H522"/><path d="M38 395H60V341H93V395H500V341H522"/><path d="M38 580H60V526H104V580H500V526H522"/></g>
<g font-size="18"><text x="60" y="140">tH = 1.0ms</text><text x="270" y="180" font-weight="700">D = 5%</text><text x="60" y="325">tH = 1.5ms</text><text x="270" y="365" font-weight="700">D = 7.5%</text><text x="60" y="510">tH = 2.0ms</text><text x="270" y="550" font-weight="700">D = 10%</text></g>
<g font-size="15" text-anchor="middle" fill="#475569"><text x="60" y="241">0ms</text><text x="500" y="241">20ms</text><text x="60" y="426">0ms</text><text x="500" y="426">20ms</text><text x="60" y="611">0ms</text><text x="500" y="611">20ms</text></g>
<rect x="25" y="640" width="510" height="76" rx="8" fill="#fff7ed" stroke="#ea580c"/>
<g text-anchor="middle"><text x="280" y="670" font-size="19" font-weight="700">占空比 D = tH / T × 100%</text><text x="280" y="699" font-size="17">周期固定时：占空比 ↔ 脉宽 ↔ 角度 / 速度</text></g>
</g></svg>
