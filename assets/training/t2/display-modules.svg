<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><text x="30" y="43" font-size="23" font-weight="bold" fill="#0f172a" font-family="Microsoft YaHei, sans-serif">SSD1306 I²C OLED显示过程中的模块分工</text><path d="M275.0 160 L275.0 195" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M275.0 270 L275.0 305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M275.0 380 L275.0 415" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 452.5 L635 350.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="85" width="450" height="75" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="275.0" y="112" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">应用 app</text><text x="275.0" y="136" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">提供当前电压、状态等业务数据</text><rect x="50" y="195" width="450" height="75" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="275.0" y="222" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">界面 ui</text><text x="275.0" y="246" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">安排显示内容、行号与布局</text><rect x="50" y="305" width="450" height="75" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="275.0" y="332" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">显示驱动 oled</text><text x="275.0" y="356" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">将数字与字符转换为屏幕数据</text><rect x="50" y="415" width="450" height="75" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="275.0" y="442" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">板级接口 → HAL → I²C外设</text><text x="275.0" y="466" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">通过配置的外设发送数据</text><rect x="635" y="90" width="405" height="100" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="837.5" y="117" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">业务数据：电压 / 状态</text><text x="837.5" y="141" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">电压与状态用整数保存</text><text x="837.5" y="165" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">业务模块提供模拟数据</text><rect x="635" y="300" width="405" height="100" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/><text x="837.5" y="327" text-anchor="middle" font-size="17" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">屏幕呈现像素</text><text x="837.5" y="351" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">某些驱动先写缓冲，再统一刷新</text><text x="837.5" y="375" text-anchor="middle" font-size="14" fill="#0c4a6e" font-family="Microsoft YaHei,sans-serif">具体过程取决于驱动设计</text></svg>